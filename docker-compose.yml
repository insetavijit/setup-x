services:
  firefox:
    image: lscr.io/linuxserver/firefox:latest
    container_name: firefox
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined

    ports:
      - "3000:3000"
      - "3001:3001"

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata

    volumes:
      - ./config:/config

    shm_size: "1gb"